name: Security

on:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read  # required for `gh pr list` in reconcile-preview-dbs.ts

jobs:
  nightly-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies (high/critical)
        run: pnpm audit --audit-level=high

      - name: Secret scan (gitleaks)
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Reconcile orphaned preview D1 databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `gh` CLI reads GH_TOKEN. The auto-provided GITHUB_TOKEN (scoped
          # via `permissions: pull-requests: read` above) is sufficient for
          # `gh pr list` — no custom PAT needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm reconcile:preview-dbs
