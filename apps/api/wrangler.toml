#:schema node_modules/wrangler/config-schema.json
name = "runway-api-dev"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
account_id = "5cbaf7492795d0e9eafa26240b14389c"

# SPEC-05: bundled Arimo font files are imported as ArrayBuffer (adapters/pdf-fonts.ts).
[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = false

# ---------------------------------------------------------------------------
# Default (dev) environment bindings
# ---------------------------------------------------------------------------

# Non-secret runtime config. Secrets (JWT_SECRET, TOKEN_PEPPER, READYZ_TOKEN,
# RESEND_API_KEY, SENTRY_DSN) go via `wrangler secret put` and .dev.vars for
# local; they are NEVER in this file. env-parity check requires the same var
# names across [env.*] blocks — mirror any addition here into preview + prod.
[vars]
APP_ENV = "development"
APP_ORIGIN = "http://localhost:8787"
BUILD_SHA = "dev"
EMAIL_PROVIDER = "noop"
PASSWORD_MIN_LENGTH = "12"
RATE_LIMIT_AUTH_LOGIN = "5"
RATE_LIMIT_AUTH_SIGNUP = "3"
PDF_RENDERER = "browser"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/auth/*", "/me", "/me/*", "/roles", "/audit", "/customers", "/customers/*",
  "/price-list", "/admin/*", "/templates", "/templates/*", "/contracts", "/contracts/*", "/approvals/*", "/demo/*", "/healthz", "/readyz", "/docs", "/openapi.json" ]

[[d1_databases]]
binding = "DB"
database_name = "runway_dev"
database_id = "1969f138-257f-4a0b-8601-2c1c98965f06"
migrations_dir = "src/db/migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "c3ee8d4475c74a28abf245a50a1421bf"
preview_id = "fa8bf1ef1d9f47368df32e92a6a93ec7"

[[kv_namespaces]]
binding = "SETTINGS"
id = "68e574ac39a44f9bb044baa9db6ab37d"
preview_id = "18292b11b5f04ab9ab19c1eab1b7694b"

[[queues.producers]]
binding = "EMAIL_RETRY_QUEUE"
queue = "email-retry"

# App-level DLQ producer: retry-consumer explicitly pushes exhausted
# messages here. CF's `dead_letter_queue` on the retry consumer only
# fires on `msg.retry()` after CF's platform max_retries — which is a
# different (and more limited) trigger than "app-level MAX_RETRY_ATTEMPTS
# exceeded". Both paths land on the same queue name, so DLQ inspection
# still works via `wrangler queues consumer email-dlq peek`.
[[queues.producers]]
binding = "EMAIL_DLQ_QUEUE"
queue = "email-dlq"

[[queues.consumers]]
queue = "email-retry"
dead_letter_queue = "email-dlq"
max_batch_size = 10
max_retries = 3

# SPEC-05: issued-contract PDFs. Chrome via Browser Rendering, files in R2, generated by the
# `contract-pdf` queue after issue (+ the */5 sweeper). Bucket + queue are created by the human (docs/deploy.md).
[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hopdong-files-dev"

[[queues.producers]]
binding = "CONTRACT_PDF_QUEUE"
queue = "contract-pdf-dev"

[[queues.consumers]]
queue = "contract-pdf-dev"
max_batch_size = 1
max_retries = 3

# Cron: verify-email sweeper. Every 5 minutes. Re-notifies users who
# signed up >15min ago but haven't verified. See
# src/crons/verify-email-sweeper.ts + docs/email.md.
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[[ratelimits]]
name = "RL_AUTH_LOGIN"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_AUTH_SIGNUP"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_AUTH_VERIFY"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_AUTH_REFRESH"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_READYZ"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

# ---------------------------------------------------------------------------
# Preview environment (per-PR). D1 database_id is a placeholder substituted
# by CI (preview.yml) after `wrangler d1 create runway-preview-pr-${PR}`.
# Binding names MUST stay identical to the other environments; only the
# targeted resource (D1 database_id) differs per PR.
# ---------------------------------------------------------------------------

[env.preview]
# CI (preview.yml) substitutes PLACEHOLDER_PR with the PR number via sed
# before `wrangler deploy --env preview`, giving each PR an isolated worker.
name = "runway-api-preview-pr-PLACEHOLDER_PR"

[env.preview.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/auth/*", "/me", "/me/*", "/roles", "/audit", "/customers", "/customers/*",
  "/price-list", "/admin/*", "/templates", "/templates/*", "/contracts", "/contracts/*", "/approvals/*", "/demo/*", "/healthz", "/readyz", "/docs", "/openapi.json" ]

[env.preview.vars]
APP_ENV = "preview"
APP_ORIGIN = "https://runway-api-preview-pr-PLACEHOLDER_PR.workers.dev"
BUILD_SHA = "preview"
EMAIL_PROVIDER = "noop"
PASSWORD_MIN_LENGTH = "12"
RATE_LIMIT_AUTH_LOGIN = "5"
RATE_LIMIT_AUTH_SIGNUP = "3"
PDF_RENDERER = "browser"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "runway_preview"
